# GolfReelz Pi capture agent — per-device config.
# Copy this file to config.yaml and edit the values for THIS Pi.
# The auth_token determines whether this device runs tee-side
# (person detection + recording) or green-side (long-poll + recording)
# logic — the backend tells us at the first heartbeat.

# ---------------------------------------------------------------------
# Backend connection
# ---------------------------------------------------------------------

backend_url: "https://your-deployment.replit.dev"

# The auth_token visible on /admin/cameras for this device. Can also
# be supplied via the GOLFREELZ_AUTH_TOKEN env var (overrides this
# file value) so you don't have to commit it to the SD card.
auth_token: "cam_REPLACE_ME"

# ---------------------------------------------------------------------
# Camera source
# ---------------------------------------------------------------------

# WHICH CAPTURE ENGINE RECORDS A CLIP. Two live in the tree at once.
#
#   decode  (default, and what every rig has always run)
#           Decode the camera's H.264 to raw frames, re-encode with
#           mp4v, re-encode again for upload. Three generations, all of
#           them on the Pi, and the software encoder tops out near
#           31 fps at 1080p -- which is why a camera set to 60 gives
#           you about half of it.
#
#   copy    Keep a rolling window of the camera's OWN encoded video on
#           disk and cut the swing out of it. No decode, no encode.
#           Measured on 22.2s of real 1080p60 footage: 0.42s against
#           9.14s, and first-generation rather than third.
#
#           Needs an rtsp:// camera; falls back to decode with a warning
#           on anything else. The clip is whatever bitrate the camera is
#           sending, so the camera's profile bitrate becomes the upload
#           bitrate -- set it to what the link can carry rather than to
#           its maximum. Clips cut on segment edges, so expect up to one
#           extra second at each end.
#
# Detection is unaffected either way: without a substream there is still
# only one stream worth decoding, and the trigger logic is untouched.
# capture_engine: "copy"
#
# Only read when capture_engine is "copy".
# copy_segment_seconds: 1.0     # cut granularity; match the camera's GOV
#
# How much DECODED pre-roll to keep in RAM while the copy engine is the
# one recording. The segment ring above is the real pre-roll, so this
# one exists for two things only: the detector, which looks at the
# newest frame, and the decode FALLBACK that records a swing the old way
# when the segment ring is unhealthy. Left at buffer_seconds it costs
# ~1.9GB at 1080p60 to hold frames nothing reads. What the default costs
# you: on that fallback path only, a clip opens 2s before the trigger
# instead of buffer_seconds — downswing and impact, probably not the
# address.
# copy_fallback_preroll_seconds: 2.0
# copy_window_seconds: 0        # 0 = buffer_seconds + max_clip_seconds + 30
#
# HOW LONG THE RING KEEPS FOOTAGE. The default (155 s) is only what a
# single clip needs. Raise it and the ring becomes a recovery buffer:
# on 11 Oct two swings were lost outright because /event-trigger hit
# "Network is unreachable" and the agent logged "skipping" — nothing
# recorded, nothing spooled, gone. With an hour of retention that
# footage is still on disk when the link comes back.
#
#   copy_window_seconds: 3600     # one hour
#
# AGE IS NOT A SIZE, and this is the trap. The window is in seconds;
# the segments are whatever bitrate the CAMERA is sending, which the
# operator sets. An hour is:
#
#    4000 kbps  ->  1.8 GB        16000 kbps  ->  7.2 GB
#
# and the 2 GB upload spool shares the same filesystem. So retention
# yields to disk. A free-space floor is always on; a byte cap is
# available for a small card. When either bites, the ring logs once
# that retention is being cut short by DISK rather than by the window,
# and `evicted_for_space` counts it.
# copy_min_free_mb: 1024        # always keep this much free (0 = off)
# copy_window_max_mb: 0         # hard byte cap on the ring (0 = none)

camera:
  # "auto" tries /dev/video0..3 and picks the first that opens. Or
  # specify a device path like "/dev/video0" or an integer index "0".
  device: "auto"
  # THE CAMERA'S SMALL PROFILE, for the stream-copy capture path. An
  # IP camera emits several profiles at once, and detection does not
  # need the big one: YOLO downscales to 320px wide regardless, so
  # decoding 1080p to find a golfer is work thrown away. Point this at
  # a low-resolution profile and the full-size stream is never decoded
  # at all -- it is copied to disk and copied out again.
  #
  # Unused by the current (decode-and-re-encode) path; read by
  # copycap_probe.py and by the copy engine when it is switched on.
  # substream_device: "rtsp://admin:{password}@192.168.50.10/profile3/media.smp"
  # OPTIONAL capture-mode preset (Pi HQ Cam / IMX477). Overrides
  # width/height/fps below. Higher fps = ~2x tracer points and less
  # motion blur on the ball; costs bigger uploads + more RAM for the
  # pre-roll buffer (5s of 1080p50 ~= 1.6GB, 990p120 ~= 2.4GB — fine
  # on an 8GB Pi 5). The tee ROI is auto-scaled to the new geometry.
  #   1080p30  — 1920x1080@30, the long-standing default
  #   720p30   — 1280x720@30, what the Hanwha XNV-6080R's own profile
  #              is set to. ON AN IP CAMERA THE MODE REQUESTS NOTHING:
  #              the sensor is set in the camera's web UI and this only
  #              tells the agent what to expect. Set it to whatever the
  #              Cameras card reads back under "Camera says", or the
  #              ring buffer, the clip's stamped rate and the stall
  #              threshold are all sized for a camera that is not there.
  #   720p50   — 1280x720@50, the 50fps mode the encoder can sustain
  #   1080p50  — 1920x1080@50, only on a COOL (unthrottled) Pi: the
  #              software encoder tops out near 31 fps at 1080p when
  #              throttled, and frames past that are lost
  #   1080p60  — 1920x1080@60, what the Hanwha XNV-6080R can be set to
  #              send and what a ball-freezing shutter (1/1000+)
  #              assumes. Same encoder ceiling as 1080p50, and the
  #              pre-roll buffer wants ~1.9GB at buffer_seconds: 5 —
  #              fine on an 8GB Pi, not on a 4GB one. Compressing a
  #              clip also costs roughly twice what it does at 30fps,
  #              so on a rig whose uploads already lag, this is how
  #              the queue stops draining.
  #   990p120  — 1280x960@120, cropped, for high-speed experiments
  # At 50fps consider raising upload_bitrate_kbps (tee: ~5000) so
  # per-frame quality doesn't drop.
  # mode: "1080p50"
  # Capture resolution. GoPro Hero 13 USB-webcam mode is 1080p30.
  # Pi HQ Cam supports up to 4056x3040 but a Pi 5 will struggle at
  # full res; 1080p30 is the sweet spot for either camera.
  # ON AN RTSP CAMERA THESE ARE A BELIEF, NOT A SETTING. open_camera()
  # returns early for an rtsp:// device — resolution, frame rate and
  # shutter all live in the camera's own web UI, and nothing here is
  # sent to it. What this block still decides is how the agent SIZES
  # itself: the pre-roll ring buffer holds `buffer_seconds * fps`
  # FRAMES, so a config that says 30 against a camera sending 60 keeps
  # half the pre-roll it promises — and the pre-roll is what catches
  # the backswing before the trigger fires. Change the camera, change
  # this to match.
  width: 1920
  height: 1080
  fps: 30
  # SHUTTER SPEED in microseconds. Leave commented out for auto (the
  # long-standing behaviour).
  #
  # A struck ball crosses roughly 1100px/s in this frame. Auto-exposure
  # under overcast picks a long shutter, and the smear that follows is
  # what makes a white ball vanish against a pale sky:
  #
  #     1/60s   16667µs   ~18px smear   ball's contrast /5
  #     1/250s   4000µs   ~4.4px
  #     1/500s   2000µs   ~2.2px        <- a good target
  #     1/1000s  1000µs   ~1.1px        diminishing; noise keeps rising
  #
  # The ball is about 4px across at tee-camera distance, so once the
  # smear is under that there is nothing further to win. Shortening the
  # shutter costs gain (1/60 -> 1/500 is three stops, ~8x gain, ~2.8x
  # noise), so do not go shorter than the sky actually needs.
  #
  # Not every driver accepts this through libcamerify's V4L2 shim.
  # Check first, and read the agent's log line back:
  #     sudo systemctl stop golfreelz-agent
  #     libcamerify v4l2-ctl -d /dev/video0 --list-ctrls
  # shutter_us: 2000
  # Sensor gain to go with a pinned shutter. Unset leaves the driver's
  # own choice, which is usually what you want.
  # gain: 8.0

# ---------------------------------------------------------------------
# Tee-side ONLY: where in the camera's frame the "tee box" lives.
# Pixel coords in the captured frame (origin top-left). Find them by:
#   1. ssh into the Pi
#   2. python3 -c "import cv2; cap=cv2.VideoCapture(0); ok,f=cap.read(); cv2.imwrite('frame.jpg',f)"
#   3. open frame.jpg locally, draw a rectangle around the tee
#      markers in your image editor, note the pixel coords.
# Green cameras can leave this commented out.
# ---------------------------------------------------------------------

tee_box_roi:
  x: 600
  y: 400
  w: 700
  h: 500

# ---------------------------------------------------------------------
# Detection (tee-side only)
# ---------------------------------------------------------------------

detection:
  # How often to run the person detector (Hz). Lower = less CPU.
  # 5 fps is plenty for "is a person standing there for >=2 s".
  fps: 5
  # Person must be inside the ROI for this many seconds before we
  # consider it a real address-position (filters cart drive-bys).
  #
  # WORTH RAISING WELL ABOVE 2 on a busy tee. Nobody walks onto a tee
  # and hits inside ten seconds, so a long dwell costs no swings and
  # throws out everything that merely crosses the zone — a cart, a
  # player fetching a ball, somebody walking to the next tee. It also
  # starts the clip nearer the shot: the recording begins at the
  # trigger minus the pre-roll, so a ten-second dwell is roughly five
  # fewer seconds of standing about at the front of every clip.
  #
  # It does NOT help with a group genuinely waiting on the tee. They
  # are there for minutes and will trigger whatever this says.
  trigger_dwell_seconds: 2
  # HOW LONG THE DETECTOR MAY LOSE THEM without the dwell starting
  # over. Detection runs at `fps` above, so a dwell of N seconds is
  # N*fps consecutive sightings — and this config already notes, a few
  # lines down, that "a golfer bending to tee up, turning away, or
  # stepping aside briefly makes the person detector drop out for a
  # few seconds". With no grace at all a 2-second dwell survives that
  # by luck and a 10-second one does not survive it at all.
  #
  # The trigger still requires them to be visible in the zone at the
  # moment it fires, so this cannot let something that has left
  # trigger on its way out.
  trigger_dwell_grace_seconds: 3
  # After the trigger, keep recording until no person is seen for
  # this many seconds, then stop. This is the "group window": a golfer
  # bending to tee up, turning away, or stepping aside briefly makes the
  # person detector drop out for a few seconds, so it cannot go near
  # zero or one presence gets split into several short clips.
  #
  # WAS 30, FOR "record the group and cut the swings out of it". That
  # plan needs the cutting to work. Measured on hole 8, 21 Oct: 19
  # sessions, every one of them ran to the 120s cap because the longest
  # stretch with nobody in the zone was 21.5 seconds -- a group waiting
  # their turn never leaves for thirty. Each capped clip is ~57 MB
  # against ~6 MB for a real one, and swing_select then found 1 swing
  # in 8 on that camera, so they went up whole or not at all.
  #
  # 12 is above the detector's dropout and below the gap between
  # groups. It does NOT fix a zone somebody stands in continuously --
  # see tools/stop_policy_test.py, where a sighting every 8s runs to
  # the cap at 12s just as it does at 30s. It ends the clip in the
  # gaps, which is where most of the 120 seconds was being spent.
  no_person_timeout_seconds: 12
  # Frame is downsampled to this width before the pose model sees it.
  # Smaller = faster but less reliable at distance. 320 px works
  # well for a person at ~5-15 m.
  detect_width: 320

# ---------------------------------------------------------------------
# Buffers / recording
# ---------------------------------------------------------------------

# How many seconds of pre-roll to keep in RAM. The trigger commits
# this buffer first so the address frame and backswing are captured.
buffer_seconds: 5

# How long BOTH cameras wait after the trigger before they start
# recording.
#
# The trigger fires when a person dwells in the tee box, and from there
# it is a tee peg, a glove, a look down the fairway and a couple of
# waggles: ten seconds at the very fastest, usually twenty or more. All
# of that used to be recorded, compressed and pushed over a cellular
# link for footage nobody watches -- and nothing reaches the green for
# longer still. The event is still armed at the trigger, so the backend
# pairs the two halves exactly as before; only the recording waits.
#
# The tee measures the hold from the trigger, the green from when the
# trigger reaches it (a long-poll return later). The two starts are
# close, and the backend aligns the cut on wall clock regardless.
#
# The hold applies to the pre-roll as well, so a clip really does begin
# here rather than buffer_seconds before it. Raise it if your groups are
# slower; lower it if you ever see a swing clipped at the front. An
# operator Capture from the Cameras page ignores it entirely.
record_delay_seconds: 10

# A SAFETY RAIL — but it was briefly the clip length, and the history
# matters if you are thinking of changing it.
#
# A session runs until the tee box empties, which on a par-3 with a group
# waiting meant 143 s, 175 s, 215 s clips. When an upload was one
# whole-file POST against a 180 s write timeout, 27-40 MB never arrived,
# so the cap was cut to 30 s: a series of clips that each made it, rather
# than one long one that did not.
#
# Chunked, resumable upload removed that ceiling. A clip goes up in
# slices, the server banks each one, and a clip that needs twenty minutes
# and four link outages still lands. Size costs TIME now, not the clip —
# and the encode bitrate steps down on its own when the link proves it
# cannot keep up, so a long clip on a bad link gets smaller rather than
# getting lost.
#
# So this is back to bounding a stuck ROI rather than deciding how long a
# swing may be. 30 s was cutting real swings in half; 120 s covers a
# golfer's whole time over the ball with room to spare.
#
# The split keeps the pre-roll buffer, so consecutive clips OVERLAP by
# buffer_seconds and a swing landing on a boundary is still complete in
# one of them.
#
# GREEN side: leave this ABOVE the tee's value. The green stops when the
# tee signals it, so its cap is only a backstop for a lost signal — set
# below the tee's and the GREEN starts truncating every long clip, which
# is the one thing it must never do.
# Code defaults if unset: tee 120, green 150.
max_clip_seconds: 120

# RUNAWAY GUARD. A length-cap split means "the person is still in the
# ROI", and with a loose ROI that stays true forever — someone on the
# fairway or the cart path holds it open and the tee records capped
# clips back to back with no end. Each costs real compress and upload
# time on a Pi also capturing at 50fps, so the queue only grows. Longer
# clips make each one dearer, which is what this guard is for.
#
# After this many consecutive splits the automatic trigger pauses for
# split_cooldown_seconds. An operator Capture still gets through.
#
# If you see the warning it fires, the real fix is tee_box_roi: a full
# 1280x720 ROI triggers on anyone anywhere in shot. Draw it around the
# tee box.
#
# These move with max_clip_seconds. At 30 s clips, 4 splits then 90 s off
# was a modest duty cycle; at 120 s the same numbers are eight minutes
# solid then a 90 s pause, which guards nothing. Two capped clips in a
# row is already four minutes of unbroken presence.
max_consecutive_splits: 2
split_cooldown_seconds: 180

# Green-side only: how often to ask the backend whether the tee has
# signalled end-of-session. Lower = green stops closer to the tee but
# more HTTP traffic. 1 s is a good balance.
stop_poll_interval_seconds: 1.0

# Re-encode each clip to H.264 at this bitrate (kbps) before upload.
# Two wins: (1) clips play in any browser — the raw mp4v the camera
# writes won't play in desktop Chrome; (2) far smaller/faster to send on
# a cellular SIM (a ~100 MB mp4v clip -> ~10 MB). Set to 0 to disable.
# Code defaults differ by role if this is unset: the GREEN uses 1500
# (green.py) and the TEE uses 3500 (tee.py). This comment used to say
# 2.5 and 5 Mbps, which was true of neither -- and the green's real
# default is the one that matters, because 1500 on a 1080p60 copy-engine
# rig throws away two thirds of the camera's bits. Optionally downscale
# with upload_scale_height (e.g. 720).
#
# ON A COPY-ENGINE RIG, PREFER A CEILING ABOVE THE CAMERA'S BITRATE.
# compress_video skips the re-encode entirely when the target is at
# least COMPRESS_MIN_SAVING (0.9) of what the clip already is, so a
# ceiling above the camera's output means the clip ships first-
# generation: the camera's own H.264, the camera's own GOV, and no
# software x264 pass on a Pi that has no hardware encoder. A ceiling
# BELOW it re-encodes at -preset veryfast and stamps libx264's default
# 250-frame keyint on the clip -- a 4-second GOP at 60fps, which makes
# frame-stepping in the editor decode up to 249 frames per step.
#
# "LEAVE UNSET TO KEEP CAPTURE RES" IS ONLY TRUE ON THE TEE, and this
# line used to say it without that qualifier. The GREEN defaults to 720
# when the key is absent (green.py), on purpose -- see the reasoning
# there -- so commenting this out does not turn downscaling off on a
# green, it turns it on at 720. To actually disable it on a green, set
# it explicitly:
#
#     upload_scale_height: 0
#
# 0 is falsy, so the uploader passes scale_height=None and no scale
# filter is applied. That is the only form that means "off" on both
# roles.
upload_bitrate_kbps: 2500
# IT IS A CEILING, NOT A SETTING, and it governs the copy engine too.
# The uploader halves this when a clip keeps failing, or when one keeps
# inching across without finishing, and walks it back up after clean
# sends. While it sits BELOW the number above, stream-copied clips are
# re-encoded to it as well -- the capture engine's "already what we mean
# to send" exemption only holds while the link can carry it. The journal
# says so each time, and names the ceiling it is using.
# upload_scale_height: 720

# Clips whose upload fails are kept here (under work_dir/pending) and
# retried whenever the uploader is idle, instead of being deleted. These
# bound it so a long outage cannot fill the SD card — oldest out first.
# upload_spool_max_mb: 2048
# upload_spool_max_age_hours: 24

# HOW LONG ONE UPLOAD ATTEMPT MAY TAKE, in seconds. A course link can sit
# dead for minutes and then run at full speed; a 6.3 MB clip needing only
# 289 kbps sustained still died, because every attempt happened to sit in
# a dead window for its whole duration. A longer attempt is simply still
# in progress when the link returns.
#
# Patience costs the queue, though, so it is spent where it is free:
#   fresh_timeout   a new clip with others waiting behind it. Short —
#                   if it misses, it is spooled and nothing is lost.
#   idle_timeout    a new clip with nothing behind it.
#   patient_timeout a spool retry. The worker is idle by definition here,
#                   so a long wait costs nothing at all.
# upload_fresh_timeout: 120
# upload_idle_timeout: 240
# upload_patient_timeout: 300
# (patient_timeout is multiplied by 5 when chunked upload is on -- see
#  below: a long chunked attempt banks progress instead of wasting it.)

# RESUMABLE UPLOAD. The tee's uplink is a USB cellular modem that reboots
# itself roughly every 30 seconds under load: dmesg shows it alive ~23s
# at ~125 KB/s, then gone ~8s while it re-enumerates on the USB bus
# (interface index reached 82 in one afternoon). A 6.5 MB clip needs
# ~52s of live wire, so it CANNOT finish inside one of those windows --
# every whole-file POST spent its timeout in a dead window and discarded
# everything it had already sent. The clip that failed thirty times was
# never too big for the link; it was too big for the link's uptime.
#
# With this on, a clip goes up in ~512 KB slices and the server banks the
# progress, so a reset costs one slice rather than the whole clip and the
# next window resumes where the last stopped. Progress also survives the
# agent restarting. Turn it off only to fall back to whole-file POSTs.
# upload_chunked: true
# upload_chunk_kb: 512

# BACK OFF WHEN UPLOADS ARE FAILING. Measured at Snee Farm: with both
# agents retrying back-to-back the uplink managed 4.8 KB/s; with them
# stopped, 162 KB/s -- same link, same minute, 35x. The retries were
# starving the transfers they existed to complete, and it could not
# recover on its own because nothing ever let the link go idle.
#
# After a failure the uploader goes quiet for backoff_base seconds,
# doubling each consecutive failure up to backoff_max, and attempts
# NOTHING during that window -- clips recorded meanwhile are compressed
# and spooled without a try. One success clears it.
# upload_backoff_base: 20
# upload_backoff_max: 600

# ONE THING AT A TIME. Observed on the course: a single golfer coming
# through with nothing else happening uploaded fine, while the same Pi
# triggering, recording, compressing and uploading at once could not
# move a 3.1 MB clip needing 212 kbps — on a link that had just measured
# 1300 kbps idle.
#
# So the uploader stands completely down while a capture is running, and
# for this many seconds after it ends. Clips recorded meanwhile are
# compressed and spooled, not sent, and go up in the next quiet stretch.
# Raise it if the Pi still struggles; lower it if clips sit too long.
#
# GREEN: leave this LONGER than the tee's. Both Pis record the same event
# and stop within a second of each other, so an equal settle wakes them
# into the same window and they upload simultaneously — a fix for
# contention turned into a metronome for it. Code defaults: tee 120,
# green 240, so the tee's clip (the one the tracer needs) goes first.
# upload_settle_seconds: 120

# ---------------------------------------------------------------------
# Swing select (tee, copy engine only) — upload the swings, not the session
# ---------------------------------------------------------------------
# A session runs until the tee box empties: 36-126 s holding three or
# four swings and a lot of standing about, all of it uploaded. At 4000
# kbps a 120 s clip is 60 MB, eleven minutes on a modem that
# re-enumerates every couple of minutes, and it usually does not
# finish. The same session as two 13.5 s cuts is 6.75 MB each, about
# seventy seconds — and those fit between the drops. The win is not
# the byte count, it is landing inside the gap.
#
# Measured on real tee footage (docs/swing-detection-eval.md):
# event-736 went to 2 clips covering 26% of the session, event-859 to
# 3 covering 49%.
#
# OFF BY DEFAULT. A rig in the field must not change what it uploads
# because its agent was updated.
#
# NOTHING HERE CAN LOSE A SWING. Every failure — no tracker, too few
# samples, nothing found, nobody in the ROI, a refused cut, a partial
# cut set, an exception — falls back to uploading the session whole,
# exactly as before. The worst it does is fail to save bandwidth.
#
# swing_select:
#   enabled: true
#   sample_hz: 20          # a swing's burst is ~0.4 s; 20 Hz puts 8 across it
#   # WHERE IT MEASURES IS THE TRIGGER ZONES, not a setting. The boxes
#   # drawn on the Cameras page are already per-camera, already scaled
#   # to the frame, and already exclude the cart path and the bench
#   # between tees — so swing select follows them, and there is nothing
#   # here to keep in step. The band below applies ONLY until zones
#   # arrive (a fresh agent before its first poll), and defaults to the
#   # whole frame so a camera with no zones measures everything rather
#   # than a strip somebody guessed.
#   roi_top: 0.0
#   roi_bottom: 1.0

# ---------------------------------------------------------------------
# Audio (both sides)
# ---------------------------------------------------------------------
# Captured in parallel with each recording via `arecord` (alsa-utils)
# and muxed into the MP4 with ffmpeg before upload. Best-effort: if
# arecord isn't installed or the device can't be opened, the agent
# falls back to silent video.

audio:
  enabled: true
  # WHO CARRIES THE SOUND. Off by default; only turn it on once you
  # have checked that the camera's profile really has an audio track:
  #
  #   URL=$(sudo grep -oE 'rtsp://[^ "]+' config.yaml | head -1)
  #   ffprobe -v error -rtsp_transport tcp -show_streams "$URL" \
  #     | grep codec_type          # want codec_type=audio
  #
  # false (default): a separate recorder opens its OWN RTSP session for
  #   audio, writes a WAV, and ffmpeg muxes it in per clip. It starts at
  #   the trigger, while the clip starts `buffer_seconds` earlier from
  #   the ring -- so THE PRE-ROLL IS SILENT, about five seconds of it,
  #   and mux_audio_into_video pads the WAV by exactly that much to keep
  #   the rest aligned. That silence is correct, not a bug, and it
  #   cannot be fixed on this path.
  #
  # true: the camera's own AAC track rides in the ring segments. The
  #   pre-roll has sound, sync is sample-accurate because it is one
  #   container rather than two recordings aligned by arithmetic, there
  #   is one RTSP session instead of two, and no mux pass per clip.
  #   16 kHz mono is ~2 KB/s, nothing beside the video.
  #
  # ONE SETTING, BOTH SIDES. The two paths must never both run: the mux
  # maps 0:v:0 and 1:a:0, so it would throw the camera's track away and
  # substitute the WAV. audio_in_segments() in common.py is the single
  # answer; nothing else decides. The decode-engine fallback always
  # uses the separate recorder -- it has no container to carry audio in.
  #
  # KNOWN BROKEN ON THE HANWHA XNV-6080R AS OF 16 OCT — LEAVE IT OFF.
  # Each 1s segment probes fine on its own (one program, h264 PID
  # 0x100 + aac PID 0x101), and then EVERY join drops the audio:
  #
  #   [concat] Could not find codec parameters for stream 1
  #            (Audio: aac, 0 channels, fltp): unspecified sample rate
  #   Stream mapping:
  #     Stream #0:0 -> #0:0 (copy)        <- audio never mapped
  #   video:3045KiB audio:0KiB
  #
  # Ruled out on the device: the probe budget (analyzeduration and
  # probesize raised 20x, no change), a partial leading segment
  # (skipping it changes nothing), the concat protocol instead of the
  # demuxer (same), duplicate ring processes (none running), and
  # multiple programs in the container (there is one, with two
  # streams -- ffprobe lists each stream under BOTH the programs and
  # the streams section, which is what made it look like four).
  #
  # The remaining lead is "no TS found at start of file" on the audio
  # stream, which points at how the segment muxer timestamps audio at
  # a segment boundary rather than at anything on the joining side.
  #
  # The result with this ON is SILENT CLIPS, which is worse than the
  # pre-roll silence it was meant to fix. The test that let it through
  # built its segments from a synthetic lavfi source whose streams are
  # far tidier than a camera's.
  in_segments: false
  # ALSA capture device. Leave unset (or set to null) to auto-detect:
  # the agent looks in /proc/asound/cards for a GoPro / HERO / UVC /
  # USB-Audio card and picks the first match. Hardcode if you have
  # multiple USB audio devices and auto-detect picks the wrong one:
  #   device: "plughw:CARD=HERO13Black"
  # List candidates with:
  #   arecord -L
  device: null
  sample_rate: 44100
  channels: 1   # mono is plenty for swing impact + ambience

# ---------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------

# Heartbeat cadence (s). Backend's offline alert watches last_seen_at.
heartbeat_seconds: 60

# Long-poll timeout for the green Pi waiting for a trigger. Below
# typical LTE / Replit-proxy idle timeouts (~30 s).
poll_timeout_seconds: 25

# ---------------------------------------------------------------------
# Battery telemetry (INA226 on I2C) — battery-powered deployments
# ---------------------------------------------------------------------
# An INA226 breakout wired inline on the 12V feed reports voltage +
# current draw on every heartbeat; the admin Cameras page shows a
# battery badge and warns before the battery dies. Harmless to leave
# enabled with no sensor attached (silently skipped).
# One-time Pi setup:  sudo raspi-config nonint do_i2c 0

battery:
  enabled: true
  i2c_bus: 1
  i2c_address: 0x40
  # Shunt resistance of YOUR board. The screw-terminal "0-36V 20A"
  # breakout is 0.002; the small blue CJMCU-226 board is 0.1.
  # Bench-check against a known load before trusting current numbers.
  shunt_ohms: 0.002

# ---------------------------------------------------------------------
# Curfew sleep/wake — battery-powered deployments
# ---------------------------------------------------------------------
# Halt the Pi outside playing hours and wake it by RTC alarm. Sleeping
# the dark hours roughly DOUBLES battery life (100Ah: ~5-6 days -> ~10-12),
# and battery swaps at night cost zero footage. Requires the RTC coin
# cell on the Pi 5's BAT connector. Times are the Pi's LOCAL time.
# Safety: won't halt on an unsynced clock; boot_grace_seconds keeps a
# freshly-booted Pi awake long enough to SSH in and disable this.

curfew:
  enabled: false          # flip to true on battery-powered rigs
  sleep: "21:00"
  wake: "06:00"
  boot_grace_seconds: 600
  # How long the rig may stay past its bedtime to finish uploading.
  # A clip spooled at 20:55 survives the halt — the spool is on the SD
  # card for exactly that reason — but nobody sees it until the Pi
  # wakes at 06:00, and a hole-in-one delivered the next morning has
  # missed the moment it was recorded for.
  #
  # Capped, because this rig runs on a battery and the curfew is what
  # makes it last a fortnight instead of five days. The tee's link has
  # gone whole afternoons without finishing an upload; left uncapped
  # that would hold the Pi awake all night and flatten it, and a dead
  # camera tomorrow is worse than a clip that arrives at dawn.
  upload_defer_minutes: 45
  # dry_run: true         # log what would happen, never power off

# ---------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------

# Local working directory for in-flight recordings AND the upload
# spool (work_dir/pending), which is the reason this is not /tmp any
# more.
#
# It used to be. On a cellular link a clip can sit in the spool for
# tens of minutes, resuming across attempts -- and /tmp does not
# survive a reboot. A 21.8 MB clip that was 72% uploaded was lost that
# way while we were power-cycling the tee's modem: the spool exists
# precisely to survive failures, so putting it somewhere volatile
# defeats the whole mechanism.
#
# /var/lib/golfreelz-agent is on the SD card and is created by the
# systemd unit's StateDirectory=, owned by the service user.
work_dir: "/var/lib/golfreelz-agent"

# Log verbosity. INFO covers normal operation; DEBUG is loud.
log_level: "INFO"

# ---------------------------------------------------------------------
# Audio trigger  (tee only, OFF by default)
# ---------------------------------------------------------------------
#
# Cut a swing because it was HEARD, instead of because somebody stood
# still long enough. Needs the copy engine (it cuts from the segment
# ring) and a camera with a working microphone.
#
# WHY BOTH SIGNALS. Measured on this course: motion alone found 13 of
# 20 swings at its best setting with no stable pair -- a foursome
# walking and pulling clubs is the noise floor and it is high. Sound
# alone cannot tell WHOSE swing it is, and at ratio 8 it clears
# talking by only ~1.3x. So a cut needs a crack AND a golfer standing
# in the named zone at that moment; a false peak then has to coincide
# with somebody on that tee before it costs anything.
#
# NOTHING HERE CAN LOSE A SWING. The dwell keeps recording and
# uploading exactly as it does now; this adds clips, it does not gate
# them.
#
# audio_trigger:
#   enabled: false
#   # SHADOW FIRST, ALWAYS. Writes the cut it WOULD have made to the
#   # journal and changes nothing. Run it a day and compare against
#   # what the dwell actually recorded before trusting it:
#   #   journalctl -u golfreelz-agent | grep 'audio trigger'
#   shadow: true
#   # Peak / rolling-median ratio. Measured on hole 8: swings x19-x30,
#   # talking x5-x7. 8 splits them with about a 1.3x margin, which is
#   # thin -- re-measure per course with the Test cut audio detector
#   # before assuming it travels.
#   min_ratio: 8.0
#   # Which trigger zones count, BY INDEX in the camera's box list.
#   # Omit (or leave empty) for "any zone". A back-tee-only rig is
#   # [0] if the back tee is the first box drawn.
#   confirm_zones: [0]
#   confirm_tolerance_sec: 6.0   # a player at address barely moves
#   before_sec: 4.5
#   after_sec: 9.0
#   # The listener's own baseline. Too short and a loud passage raises
#   # the bar until a swing inside it cannot clear; too long and it is
#   # slow to notice the course going quiet.
#   baseline_sec: 30.0
#   window_seconds: 185.0        # match the video ring, or a cut can
#                                # outlive its own audio
#   # A STRIKE AT FRONT-TEE RANGE IS INVISIBLE TO THIS. Air absorbs
#   # high frequencies fastest, so a far strike arrives as a dull thump
#   # with ~1% of its energy above 1.5 kHz and the high-pass removes
#   # exactly what survived the trip: measured x13.4 full-band and
#   # x1.02 after the filter. Lowering this does not fix it -- the
#   # band where a far strike lives is also where bag thumps and wind
#   # live. The dwell is the fallback for those tees.
#   highpass_hz: 1500.0
#   max_attack_ms: 30.0
#   min_separation_sec: 6.0
